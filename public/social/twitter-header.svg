<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ee"/>
      <stop offset="55%" stop-color="#fdf8f3"/>
      <stop offset="100%" stop-color="#fde8d8"/>
    </linearGradient>
    <linearGradient id="peach" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <radialGradient id="glow1" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="rgba(251,146,60,0.30)"/>
      <stop offset="100%" stop-color="rgba(251,146,60,0)"/>
    </radialGradient>
    <radialGradient id="glow2" cx="10%" cy="90%" r="50%">
      <stop offset="0%" stop-color="rgba(167,139,250,0.18)"/>
      <stop offset="100%" stop-color="rgba(167,139,250,0)"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#fb923c" fill-opacity="0.10"/>
    </pattern>
  </defs>

  <!-- Base -->
  <rect width="1500" height="500" fill="url(#bg)"/>
  <rect width="1500" height="500" fill="url(#dots)"/>
  <rect width="1500" height="500" fill="url(#glow1)"/>
  <rect width="1500" height="500" fill="url(#glow2)"/>

  <!-- TOP-LEFT brand strip (kept above the avatar overlap zone which lives bottom-left) -->
  <g transform="translate(60, 50)">
    <!-- 3 bars -->
    <rect x="0"  y="0"  width="18" height="80" rx="9" fill="url(#peach)"/>
    <rect x="26" y="18" width="18" height="62" rx="9" fill="url(#peach)" opacity="0.65"/>
    <rect x="52" y="36" width="18" height="44" rx="9" fill="url(#peach)" opacity="0.35"/>
    <text x="92" y="55" font-family="-apple-system, 'Helvetica Neue', sans-serif" font-size="22" font-weight="800" letter-spacing="3" fill="#1a0a00">MY AI AGENT</text>
  </g>

  <!-- HEADLINE — center-right of canvas, sized to fit -->
  <g transform="translate(310, 220)">
    <text x="0" y="0" font-family="'Bebas Neue', Impact, 'Helvetica Neue', sans-serif" font-size="96" font-weight="900" letter-spacing="3" fill="#1a0a00">BUILD YOUR OWN</text>
    <text x="0" y="92" font-family="'Bebas Neue', Impact, 'Helvetica Neue', sans-serif" font-size="96" font-weight="900" letter-spacing="3" fill="url(#peach)">AI TEAM.</text>
  </g>

  <!-- BOTTOM pills (above avatar overlap on desktop, hidden on mobile crop) -->
  <g transform="translate(310, 410)" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">
    <g transform="translate(0,0)">
      <rect width="120" height="32" rx="16" fill="rgba(251,146,60,0.10)" stroke="rgba(251,146,60,0.32)"/>
      <text x="60" y="21" text-anchor="middle" fill="#ea580c">10 templates</text>
    </g>
    <g transform="translate(132,0)">
      <rect width="100" height="32" rx="16" fill="rgba(251,146,60,0.10)" stroke="rgba(251,146,60,0.32)"/>
      <text x="50" y="21" text-anchor="middle" fill="#ea580c">16 skills</text>
    </g>
    <g transform="translate(244,0)">
      <rect width="160" height="32" rx="16" fill="rgba(16,185,129,0.10)" stroke="rgba(16,185,129,0.32)"/>
      <text x="80" y="21" text-anchor="middle" fill="#047857">Group chat · LIVE</text>
    </g>
  </g>

  <!-- RIGHT — Compact chat preview stack, narrower so it doesn't clip headline -->
  <g transform="translate(1170, 130)">
    <!-- User bubble -->
    <g transform="translate(40, 0)">
      <rect width="220" height="42" rx="21" fill="#ffffff" stroke="rgba(180,120,80,0.16)"/>
      <text x="20" y="27" font-family="-apple-system, sans-serif" font-size="13" fill="#1a0a00" font-weight="600">Build a sales agent</text>
    </g>
    <!-- AI bubble -->
    <g transform="translate(0, 56)">
      <rect width="260" height="62" rx="21" fill="url(#peach)"/>
      <text x="20" y="25" font-family="-apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.85)" font-weight="700">🤖 AGENT</text>
      <text x="20" y="46" font-family="-apple-system, sans-serif" font-size="13" fill="white" font-weight="600">5 follow-ups drafted ✓</text>
    </g>
    <!-- User bubble -->
    <g transform="translate(60, 132)">
      <rect width="200" height="42" rx="21" fill="#ffffff" stroke="rgba(180,120,80,0.16)"/>
      <text x="20" y="27" font-family="-apple-system, sans-serif" font-size="13" fill="#1a0a00" font-weight="600">Schedule outreach</text>
    </g>
    <!-- AI bubble -->
    <g transform="translate(20, 188)">
      <rect width="240" height="42" rx="21" fill="url(#peach)"/>
      <text x="20" y="27" font-family="-apple-system, sans-serif" font-size="13" fill="white" font-weight="700">Sent ✓ — 12 prospects</text>
    </g>
  </g>

  <!-- BOTTOM-RIGHT URL pill -->
  <g transform="translate(1240, 440)">
    <rect width="220" height="36" rx="18" fill="#1a0a00"/>
    <text x="110" y="23" text-anchor="middle" font-family="-apple-system, monospace" font-size="14" fill="#fff5e6" font-weight="700">myaiagents.agency</text>
  </g>
</svg>
