<style>
:root{
  --peach:#fb923c;--peach-dark:#ea580c;
  --bg:#fdf8f3;--bg-warm:#faf3eb;
  --text:#1a0a00;--text-muted:#5c3a1e;--text-subtle:#9a6a4a;
  --line:rgba(180,120,80,.14);
  --green:#10b981;--gold:#f59e0b;
  --sans:'Inter',-apple-system,sans-serif;
  --display:'Bebas Neue',serif;
  --mono:'DM Mono','SF Mono',Menlo,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--sans);background:#fff;color:var(--text);line-height:1.55;-webkit-font-smoothing:antialiased;}

.nav{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);border-bottom:.5px solid rgba(0,0,0,.08);padding:14px 24px;}
.nav-inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:16px;}
.brand{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:800;letter-spacing:-.005em;text-decoration:none;color:var(--text);}
.brand-mark{width:30px;height:30px;border-radius:7px;background:var(--peach);display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--display);font-size:18px;}
.brand-name{font-family:var(--display);font-size:22px;letter-spacing:.01em;color:#1a0a00;}
.search{flex:1;max-width:500px;background:rgba(0,0,0,.04);border-radius:10px;padding:9px 14px;display:flex;align-items:center;gap:10px;font-size:13px;}
.search input{flex:1;border:0;background:transparent;font-family:inherit;font-size:13.5px;color:var(--text);outline:none;}
.nav-actions{margin-left:auto;display:flex;gap:8px;}
.btn{font-family:inherit;font-size:13px;font-weight:700;padding:9px 16px;border-radius:9px;cursor:pointer;border:0;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:all .14s;}
.btn-ghost{background:transparent;color:var(--text);border:1px solid rgba(0,0,0,.10);}
.btn-ghost:hover{background:#fff;border-color:var(--peach);}
.btn-primary{background:var(--peach);color:#fff;box-shadow:0 4px 12px rgba(251,146,60,.32);}
.btn-primary:hover{background:var(--peach-dark);}

.tabs{display:flex;gap:0;padding:0 24px;background:#fff;border-bottom:.5px solid rgba(0,0,0,.08);position:sticky;top:58px;z-index:29;max-width:1280px;margin:0 auto;}
.tab{font-family:inherit;font-size:14px;font-weight:600;padding:14px 18px;background:transparent;border:0;color:rgba(60,60,67,.7);cursor:pointer;position:relative;letter-spacing:-.005em;}
.tab:hover{color:var(--text);}
.tab.active{color:#1a0a00;font-weight:700;}
.tab.active::after{content:'';position:absolute;left:14px;right:14px;bottom:-1px;height:2px;background:var(--peach);border-radius:1px;}

.page{max-width:1280px;margin:0 auto;padding:24px 24px 60px;}
.empty{padding:80px 20px;text-align:center;color:var(--text-subtle);font-size:14px;font-weight:600;}
.sh{display:flex;align-items:flex-end;justify-content:space-between;margin:36px 0 14px;}
.sh:first-child{margin-top:6px;}
.sh .ttl{font-size:24px;font-weight:800;letter-spacing:-.015em;color:#1a0a00;}
.sh .ttl .kicker{display:block;font-size:11px;font-weight:700;color:var(--peach-dark);letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px;}
.sh .more{font-size:14px;font-weight:600;color:var(--peach-dark);text-decoration:none;background:transparent;border:0;cursor:pointer;font-family:inherit;}

/* Hero story */
.story{position:relative;border-radius:18px;overflow:hidden;cursor:pointer;min-height:360px;display:flex;align-items:flex-end;background:linear-gradient(135deg,#1a0a00 0%,#3a1f10 50%,#ea580c 100%);color:#fff5e6;padding:28px;margin-bottom:36px;text-decoration:none;transition:transform .15s, box-shadow .15s;box-shadow:0 12px 40px rgba(0,0,0,.20);}
.story::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 80% 20%,rgba(251,146,60,.42),transparent 60%);pointer-events:none;}
.story:hover{transform:translateY(-2px);box-shadow:0 16px 48px rgba(0,0,0,.28);}
.story .em{position:absolute;top:36px;right:36px;width:160px;height:160px;border-radius:34px;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;font-size:88px;box-shadow:0 16px 40px rgba(0,0,0,.18);transform:rotate(-6deg);}
.story .info{position:relative;z-index:2;max-width:62%;}
.story .kicker{display:inline-block;background:rgba(255,255,255,.16);color:#fff5e6;font-size:11px;font-weight:800;letter-spacing:.10em;padding:5px 12px;border-radius:99px;margin-bottom:14px;text-transform:uppercase;backdrop-filter:blur(6px);}
.story h2{font-size:42px;font-weight:900;line-height:1.05;letter-spacing:-.02em;margin-bottom:10px;color:#fff;}
.story .sub{font-size:15px;color:rgba(255,245,230,.78);line-height:1.6;margin-bottom:18px;max-width:520px;}
.story .row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.story .pill{background:rgba(255,255,255,.14);color:#fff5e6;font-size:11px;font-weight:800;letter-spacing:.04em;padding:4px 11px;border-radius:99px;backdrop-filter:blur(4px);}
.story .price{font-size:22px;font-weight:800;color:#fff;}
.story .get{background:rgba(255,255,255,.96);color:#1a0a00;border:0;font-family:inherit;font-size:13px;font-weight:800;padding:8px 22px;border-radius:99px;}

/* Charts */
.charts{background:#fff;border-radius:14px;border:.5px solid rgba(0,0,0,.08);overflow:hidden;}
.row{display:grid;grid-template-columns:34px 60px 1fr auto;gap:14px;align-items:center;padding:13px 18px;cursor:pointer;border-top:.5px solid rgba(0,0,0,.05);transition:background .12s;text-decoration:none;color:var(--text);}
.row:first-child{border-top:0;}
.row:hover{background:rgba(0,0,0,.025);}
.row .rank{font-family:var(--mono);font-size:14px;font-weight:600;color:rgba(60,60,67,.6);text-align:center;}
.row .icon{width:60px;height:60px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:32px;background:linear-gradient(135deg,#fff7ee,#fed7aa);box-shadow:0 1px 0 rgba(0,0,0,.04);}
.row.team .icon{background:linear-gradient(135deg,#1a0a00,#3a1f10);color:#fff;}
.row .icon[data-cat=marketing]{background:linear-gradient(135deg,#fce7f3,#ec4899);color:#fff;}
.row .icon[data-cat=research]{background:linear-gradient(135deg,#ede9fe,#8b5cf6);color:#fff;}
.row .icon[data-cat=writing]{background:linear-gradient(135deg,#fff7ee,#fed7aa);}
.row .icon[data-cat=ops]{background:linear-gradient(135deg,#d1fae5,#10b981);color:#fff;}
.row .icon[data-cat=sales]{background:linear-gradient(135deg,#dbeafe,#3b82f6);color:#fff;}
.row .meta{min-width:0;display:flex;flex-direction:column;gap:2px;}
.row .nm{font-size:14.5px;font-weight:700;color:#1a0a00;letter-spacing:-.005em;line-height:1.2;text-overflow:ellipsis;white-space:nowrap;overflow:hidden;}
.row .sub{font-size:12.5px;color:rgba(60,60,67,.62);line-height:1.35;text-overflow:ellipsis;white-space:nowrap;overflow:hidden;}
.row .sub .badge{display:inline-block;background:rgba(251,146,60,.14);color:var(--peach-dark);font-size:9.5px;font-weight:800;padding:1px 7px;border-radius:99px;margin-right:5px;vertical-align:middle;}
.row .get{background:transparent;color:var(--peach-dark);border:1.5px solid var(--peach);border-radius:99px;font-family:inherit;font-size:13px;font-weight:800;padding:5px 18px;cursor:pointer;letter-spacing:-.005em;flex-shrink:0;text-decoration:none;}
.row .get:hover{background:var(--peach);color:#fff;}
.row .get.free{color:var(--green);border-color:var(--green);}
.row .get.free:hover{background:var(--green);color:#fff;}

/* Tiles for Editor's Choice */
.hscroll{display:flex;gap:14px;overflow-x:auto;padding:4px 4px 14px;scroll-snap-type:x mandatory;}
.hscroll::-webkit-scrollbar{height:6px;}
.hscroll::-webkit-scrollbar-thumb{background:rgba(0,0,0,.12);border-radius:3px;}
.tile{flex:0 0 270px;scroll-snap-align:start;border-radius:14px;overflow:hidden;cursor:pointer;background:#fff;border:.5px solid rgba(0,0,0,.06);text-decoration:none;color:inherit;transition:transform .15s, box-shadow .15s;}
.tile:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.08);}
.tile .cv{height:140px;background:linear-gradient(135deg,#fff7ee,#fed7aa);display:flex;align-items:center;justify-content:center;font-size:54px;}
.tile.team .cv{background:linear-gradient(135deg,#1a0a00,#3a1f10);color:#fff;}
.tile .body{padding:14px;}
.tile .nm{font-size:14px;font-weight:700;letter-spacing:-.005em;line-height:1.25;margin-bottom:4px;color:#1a0a00;}
.tile .sub{font-size:12px;color:rgba(60,60,67,.6);line-height:1.45;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.tile .row2{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:rgba(60,60,67,.6);font-weight:700;}
.tile .row2 .star{color:var(--gold);}
.tile .row2 .price{font-family:var(--mono);font-size:12px;font-weight:900;color:var(--peach-dark);}
.tile .row2 .price.free{color:var(--green);}

/* Hero / signup CTA banner at bottom */
.cta-banner{background:linear-gradient(135deg,#1a0a00,#3a1f10);color:#fff5e6;border-radius:18px;padding:36px;margin-top:48px;text-align:center;position:relative;overflow:hidden;}
.cta-banner::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,rgba(251,146,60,.32),transparent 60%);pointer-events:none;}
.cta-banner h2{position:relative;z-index:2;font-family:var(--display);font-size:48px;font-weight:400;letter-spacing:-.005em;line-height:1.05;margin-bottom:14px;color:#fff;}
.cta-banner p{position:relative;z-index:2;font-size:15px;color:rgba(255,245,230,.78);margin-bottom:22px;max-width:560px;margin-left:auto;margin-right:auto;}
.cta-banner .btn-primary{position:relative;z-index:2;background:var(--peach);color:#0c0a09;font-size:14px;padding:12px 24px;}

@media (max-width:820px){
  .story{min-height:320px;}
  .story .em{width:120px;height:120px;font-size:64px;top:24px;right:24px;border-radius:24px;}
  .story h2{font-size:30px;}
  .row{grid-template-columns:24px 50px 1fr auto;gap:10px;padding:11px 14px;}
  .row .icon{width:50px;height:50px;font-size:26px;border-radius:12px;}
  .nav-inner{flex-wrap:wrap;}
  .search{order:3;flex-basis:100%;max-width:none;}
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="brand"><div class="brand-mark">M</div><span class="brand-name">MY AI AGENT</span></a>
    <div class="search">
      <span style="font-size:13px">🔍</span>
      <input id="searchInput" type="text" placeholder="Search agents and teams…">
    </div>
    <div class="nav-actions">
      <a href="/auth.html" class="btn btn-ghost">Log in</a>
      <a href="/auth.html?tab=signup&next=/app.html" class="btn btn-primary">Sign up free →</a>
    </div>
  </div>
</nav>

<div class="tabs">
  <button class="tab active" data-tab="all"   onclick="setTab('all')">All</button>
  <button class="tab"        data-tab="team"  onclick="setTab('team')">🎯 Teams</button>
  <button class="tab"        data-tab="solo"  onclick="setTab('solo')">🤖 Solo</button>
  <button class="tab"        data-tab="free"  onclick="setTab('free')">🎁 Free</button>
</div>

<div class="page" id="page">
  <div class="empty" id="loading">Loading…</div>
</div>

<script>
const API = location.origin;
let LISTINGS = [];
let TAB = 'all';

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function jpyAsUsd(jpy){ return '$' + (Number(jpy||0)/150).toFixed(2); }

function setTab(t){
  TAB = t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', b.dataset.tab===t));
  render();
}

function visibleListings(){
  const q = (document.getElementById('searchInput').value||'').trim().toLowerCase();
  let v = LISTINGS.slice();
  if(TAB === 'team') v = v.filter(m=>m.is_team);
  else if(TAB === 'solo') v = v.filter(m=>!m.is_team);
  else if(TAB === 'free') v = v.filter(m=>!(m.price_jpy>0));
  if(q){
    v = v.filter(m=>{
      const hay = ((m.title||'')+' '+(m.description||'')+' '+(m.creator?.handle||'')+' '+(m.tag_labels||[]).join(' ')).toLowerCase();
      return hay.indexOf(q) >= 0;
    });
  }
  return v;
}

function renderRow(m, rank){
  const priceJpy = Number.isFinite(m.price_jpy) ? m.price_jpy : 0;
  let priceText, cls = '';
  if(priceJpy > 0){ priceText = jpyAsUsd(priceJpy); }
  else { priceText = 'FREE'; cls = 'free'; }
  const av = m.agent?.avatar || (m.is_team?'🎯':'🤖');
  const sub = m.is_team
    ? `<span class="badge">🎯 TEAM · ${m.member_count||0}</span>${esc(m.category_label||'Team')}`
    : esc((m.category_label||'AI') + ' · ' + (m.creator?.handle||''));
  return `<a class="row${m.is_team?' team':''}" href="/l/${esc(m.listing_id)}">`
    + (rank ? `<div class="rank">${rank}</div>` : '')
    + `<div class="icon" data-cat="${esc(m.category||'other')}">${esc(av)}</div>`
    + `<div class="meta"><div class="nm">${esc(m.title||'')}</div><div class="sub">${sub}</div></div>`
    + `<span class="get ${cls}">${priceText}</span>`
    + `</a>`;
}

function renderTile(m){
  const priceJpy = Number.isFinite(m.price_jpy) ? m.price_jpy : 0;
  let priceText = priceJpy>0 ? jpyAsUsd(priceJpy) : 'FREE';
  let cls = priceJpy>0 ? '' : 'free';
  const av = m.agent?.avatar || (m.is_team?'🎯':'🤖');
  const stars = m.rating>0 ? `<span class="star">★</span> ${m.rating.toFixed(1)}` : '';
  return `<a class="tile${m.is_team?' team':''}" href="/l/${esc(m.listing_id)}">`
    + `<div class="cv">${esc(av)}</div>`
    + `<div class="body">`
    + `<div class="nm">${esc(m.title||'')}</div>`
    + `<div class="sub">${esc(m.description||'')}</div>`
    + `<div class="row2"><span>${stars}</span><span class="price ${cls}">${priceText}</span></div>`
    + `</div></a>`;
}

function render(){
  const v = visibleListings();
  const page = document.getElementById('page');
  if(!v.length){
    page.innerHTML = '<div class="empty">No matching listings yet.</div>';
    return;
  }
  const hero = v[0];
  // Top charts: top 10 by uses
  const charts = v.slice().sort((a,b)=>(b.uses||0)-(a.uses||0)).slice(0,10);
  // Editor's choice: teams first, then NEW
  let editor = v.filter(m=>m.is_team).slice(0,8);
  if(editor.length < 4) editor = v.slice(0,8);

  // Hero
  let html = '';
  if(hero){
    const heroPrice = (hero.price_jpy>0) ? jpyAsUsd(hero.price_jpy) : 'FREE';
    let pills = `<span class="pill">${hero.is_team ? '🎯 TEAM · ' + (hero.member_count||0) + ' AI' : '🤖 SOLO AGENT'}</span>`;
    if((hero.uses||0)>=100) pills += '<span class="pill">🏆 Bestseller</span>';
    html += `<a class="story" href="/l/${esc(hero.listing_id)}">`
      + `<div class="em">${esc(hero.agent?.avatar||(hero.is_team?'🎯':'🤖'))}</div>`
      + `<div class="info">`
      + `<span class="kicker">⭐ EDITOR'S PICK · This week</span>`
      + `<h2>${esc(hero.title||'')}</h2>`
      + `<div class="sub">${esc(hero.description||'')}</div>`
      + `<div class="row">${pills}<span class="price">${heroPrice}</span><span class="get">GET</span></div>`
      + `</div></a>`;
  }
  // Top Charts
  html += `<div class="sh"><div class="ttl"><span class="kicker">Top Charts</span>What's hot now</div></div>`
    + `<div class="charts">${charts.map((m,i)=>renderRow(m,i+1)).join('')}</div>`;
  // Editor's Choice
  if(editor.length){
    html += `<div class="sh"><div class="ttl"><span class="kicker">Editor's Choice</span>Hand-picked</div></div>`
      + `<div class="hscroll">${editor.map(renderTile).join('')}</div>`;
  }
  // CTA
  html += `<div class="cta-banner">`
    + `<h2>BUILD YOUR<br>OWN AI TEAM</h2>`
    + `<p>Free to start. AI generates your team in 30 seconds. Your library, your rules.</p>`
    + `<a href="/auth.html?tab=signup&next=/app.html" class="btn btn-primary">Sign up free — get a free team →</a>`
    + `</div>`;
  page.innerHTML = html;
}

async function load(){
  try{
    const r = await fetch(API + '/api/marketplace?sort=popular');
    if(!r.ok) throw new Error('Failed to load');
    const data = await r.json();
    LISTINGS = data.listings || [];
    render();
  }catch(e){
    document.getElementById('page').innerHTML = '<div class="empty">Couldn\'t load listings: ' + esc(e.message) + '</div>';
  }
}

document.getElementById('searchInput').addEventListener('input', render);
load();
</script>
</body>
</html>
