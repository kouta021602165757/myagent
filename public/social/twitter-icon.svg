<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="20%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.5)"/>
      <stop offset="60%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Background: rounded square (Twitter profile circles it) -->
  <rect width="400" height="400" rx="80" fill="url(#bg)"/>

  <!-- Top-left highlight glow -->
  <rect width="400" height="400" rx="80" fill="url(#glow)"/>

  <!-- 3 vertical bars (signature brand mark) -->
  <g fill="white">
    <rect x="115" y="100" width="48" height="220" rx="24" opacity="1"/>
    <rect x="180" y="140" width="48" height="180" rx="24" opacity="0.65"/>
    <rect x="245" y="180" width="48" height="140" rx="24" opacity="0.35"/>
  </g>

  <!-- Subtle bottom shadow tint -->
  <rect width="400" height="400" rx="80" fill="rgba(26,10,0,0.0)"/>
</svg>
