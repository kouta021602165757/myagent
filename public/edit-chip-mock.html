<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>「このサイトを編集」ボタン + 編集チップ — モック</title>
<style>
  :root{
    --bg:#f6f2ea; --card:#fff; --ink:#1c1917; --t2:#57534e; --t3:#a8a29e;
    --wire:#ece7dd; --wire2:#e1dacb;
    --peach:#fb923c; --peach-dark:#ea580c; --peach-soft:#fff3e8;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:#e8e2d6; color:var(--ink); display:flex; justify-content:center;
    align-items:flex-start; min-height:100vh; padding:24px 12px;
  }
  .hint{
    position:fixed; top:14px; left:50%; transform:translateX(-50%);
    background:var(--peach-dark); color:#fff; font-size:12px; font-weight:700;
    padding:7px 16px; border-radius:99px; box-shadow:0 4px 14px rgba(0,0,0,.18);
    z-index:50; white-space:nowrap;
  }
  .phone{
    width:100%; max-width:412px; background:var(--bg); border-radius:22px;
    overflow:hidden; box-shadow:0 20px 50px rgba(0,0,0,.22);
    display:flex; flex-direction:column; height:760px;
  }
  /* header */
  .top{
    display:flex; align-items:center; gap:10px; padding:14px 16px;
    background:var(--bg); border-bottom:1px solid var(--wire);
  }
  .top .back{font-size:20px;color:var(--t3);}
  .top .av{
    width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#1a0a00,#3a1a08);
    display:grid;place-items:center;font-size:16px;
  }
  .top .nm{font-weight:800;font-size:15px;flex:1;}
  .top .dots{color:var(--t3);font-size:18px;}

  /* chat */
  .chat{flex:1;overflow-y:auto;padding:18px 14px;display:flex;flex-direction:column;gap:14px;}
  .msg{font-size:14px;line-height:1.65;}
  .msg.user{align-self:flex-end;background:var(--peach);color:#fff;
    padding:9px 14px;border-radius:14px 14px 4px 14px;max-width:80%;font-weight:500;}
  .msg.ai{align-self:flex-start;max-width:92%;}
  .ai-head{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800;color:var(--t2);margin-bottom:6px;}
  .ai-head .a{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#1a0a00,#3a1a08);display:grid;place-items:center;font-size:11px;}
  .ai-text{font-size:14px;color:var(--ink);margin-bottom:10px;}

  /* artifact card */
  .artifact{
    background:var(--card); border:1px solid var(--wire2); border-radius:14px;
    overflow:hidden;
  }
  .art-prev{
    height:96px; background:
      repeating-linear-gradient(135deg,#11151f,#11151f 10px,#161b27 10px,#161b27 20px);
    display:flex;align-items:center;justify-content:center;
  }
  .art-prev .badge{
    font-family:'DM Mono',monospace;font-size:13px;font-weight:800;letter-spacing:.12em;
    color:#00F0FF;border:1px solid rgba(0,240,255,.4);padding:5px 12px;border-radius:7px;
    background:rgba(0,0,0,.35);
  }
  .art-body{padding:11px 13px;}
  .art-title{font-size:13.5px;font-weight:800;}
  .art-sub{font-size:11px;color:var(--t3);font-family:'DM Mono',monospace;margin-top:2px;}
  .art-actions{display:flex;gap:7px;margin-top:11px;}
  .art-btn{
    flex:1;padding:9px 8px;border-radius:9px;font-size:12px;font-weight:700;
    font-family:inherit;cursor:pointer;border:1px solid var(--wire2);
    background:var(--bg);color:var(--t2);transition:all .15s;
    display:flex;align-items:center;justify-content:center;gap:5px;
  }
  .art-btn:active{transform:scale(.97);}
  .art-btn.edit{
    background:var(--peach-soft);border-color:#f6cfa6;color:var(--peach-dark);
  }
  .art-btn.edit.pressed{background:var(--peach);color:#fff;border-color:var(--peach);}

  /* composer area */
  .composer-area{padding:10px 12px 14px;background:var(--bg);border-top:1px solid var(--wire);}
  .composer{
    background:var(--card); border:1.5px solid var(--wire2); border-radius:18px;
    padding:10px 12px 8px; transition:border-color .18s,box-shadow .18s;
  }
  .composer.editing{
    border-color:var(--peach);
    box-shadow:0 0 0 3px rgba(251,146,60,.14);
  }
  /* the edit chip */
  .edit-chip{
    display:none; align-items:center; gap:8px;
    background:var(--peach-soft); border:1px solid #f3c79a;
    border-radius:10px; padding:7px 9px 7px 11px; margin-bottom:9px;
    animation:chipIn .22s cubic-bezier(.34,1.3,.64,1);
  }
  .edit-chip.on{display:flex;}
  @keyframes chipIn{from{opacity:0;transform:translateY(5px) scale(.97);}to{opacity:1;transform:none;}}
  .chip-ic{font-size:14px;}
  .chip-label{
    font-size:9.5px;font-weight:800;letter-spacing:.06em;color:var(--peach-dark);
    background:#fff;border:1px solid #f3c79a;padding:2px 7px;border-radius:6px;
  }
  .chip-name{font-size:13px;font-weight:800;color:var(--ink);flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .chip-x{
    width:24px;height:24px;border-radius:50%;border:0;cursor:pointer;
    background:rgba(234,88,12,.12);color:var(--peach-dark);font-size:12px;
    display:grid;place-items:center;flex-shrink:0;
  }
  .chip-x:active{transform:scale(.9);}
  textarea{
    width:100%;border:0;outline:none;resize:none;font-family:inherit;
    font-size:15px;line-height:1.6;color:var(--ink);background:none;
    min-height:46px;max-height:120px;
  }
  textarea::placeholder{color:var(--t3);}
  .tools{
    display:flex;align-items:center;gap:4px;
    border-top:1px solid var(--wire);padding-top:7px;margin-top:4px;
  }
  .tools button{
    background:none;border:0;cursor:pointer;font-size:15px;color:var(--t3);
    padding:5px 7px;border-radius:7px;
  }
  .tools .spacer{flex:1;}
  .tools .send{
    background:var(--peach);color:#fff;width:34px;height:34px;border-radius:9px;
    font-size:15px;display:grid;place-items:center;
  }
  .footnote{
    text-align:center;font-size:10.5px;color:var(--t3);margin-top:8px;
  }
  .footnote b{color:var(--peach-dark);}
</style>
</head>
<body>
<div class="hint" id="hint">↓ 「✏️ このサイトを編集」を押してみてください</div>

<div class="phone">
  <div class="top">
    <span class="back">‹</span>
    <div class="av">🤖</div>
    <div class="nm">小林秘書</div>
    <span class="dots">⋯</span>
  </div>

  <div class="chat" id="chat">
    <div class="msg user">タスク管理ツールを作って</div>

    <div class="msg ai">
      <div class="ai-head"><span class="a">🤖</span>小林秘書</div>
      <div class="ai-text">サイトを作りました ✅ 下のカードから開けます。</div>
      <div class="artifact">
        <div class="art-prev"><span class="badge">TASK.PROTOCOL</span></div>
        <div class="art-body">
          <div class="art-title">TASK PROTOCOL</div>
          <div class="art-sub">タスク管理ツール · artifact-task-manager-v3</div>
          <div class="art-actions">
            <button class="art-btn">🔗 開く</button>
            <button class="art-btn edit" id="editBtn" onclick="showChip()">✏️ このサイトを編集</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="composer-area">
    <div class="composer" id="composer">
      <div class="edit-chip" id="chip">
        <span class="chip-ic">✏️</span>
        <span class="chip-label">編集対象</span>
        <span class="chip-name">TASK PROTOCOL</span>
        <button class="chip-x" onclick="hideChip()" title="編集をやめる">✕</button>
      </div>
      <textarea id="ci" rows="2" placeholder="何をお願いしますか？"></textarea>
      <div class="tools">
        <button title="ファイル添付">📎</button>
        <button title="URL">🔗</button>
        <button title="音声">🎤</button>
        <button title="コード">&lt;&gt;</button>
        <div class="spacer"></div>
        <button class="send" title="送信">↑</button>
      </div>
    </div>
    <div class="footnote" id="foot">通常モード ・ 新規作成や普通の会話ができます</div>
  </div>
</div>

<script>
  function showChip(){
    document.getElementById('chip').classList.add('on');
    document.getElementById('composer').classList.add('editing');
    document.getElementById('editBtn').classList.add('pressed');
    document.getElementById('hint').textContent = '✏️ 編集モード — あとは "何を変えるか" を打つだけ';
    document.getElementById('foot').innerHTML = '<b>編集モード</b> ・ この指示は「TASK PROTOCOL」に確定で届きます';
    var ci = document.getElementById('ci');
    ci.placeholder = '「TASK PROTOCOL」をどう変えますか？  例: メモ欄を大きくして';
    ci.focus();
  }
  function hideChip(){
    document.getElementById('chip').classList.remove('on');
    document.getElementById('composer').classList.remove('editing');
    document.getElementById('editBtn').classList.remove('pressed');
    document.getElementById('hint').textContent = '↓ 「✏️ このサイトを編集」を押してみてください';
    document.getElementById('foot').textContent = '通常モード ・ 新規作成や普通の会話ができます';
    var ci = document.getElementById('ci');
    ci.placeholder = '何をお願いしますか？';
    ci.value = '';
  }
</script>
</body>
</html>
