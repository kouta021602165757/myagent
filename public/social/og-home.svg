<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg"
     font-family="'Inter','Helvetica Neue','Hiragino Sans','Noto Sans JP',Arial,sans-serif">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a0f08"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgA)"/>
  <circle cx="980" cy="540" r="380" fill="#fb923c" opacity="0.08"/>

  <!-- top row: brand + founder pill -->
  <g transform="translate(60,52)">
    <rect width="48" height="48" rx="11" fill="#fb923c"/>
    <text x="24" y="33" text-anchor="middle" font-size="24" font-weight="900" fill="#fff">M</text>
    <text x="64" y="32" font-size="20" font-weight="800" fill="#fff" letter-spacing="0.5">MY AI AGENT</text>
  </g>
  <g transform="translate(880,60)">
    <rect width="260" height="36" rx="18" fill="rgba(251,146,60,0.18)" stroke="rgba(251,146,60,0.42)" stroke-width="1"/>
    <text x="130" y="24" text-anchor="middle" font-size="13" font-weight="800" fill="#fb923c" letter-spacing="0.6">★ Founder 100 · 残 92 席</text>
  </g>

  <!-- headline — multi-tspan so we can lay an explicit strikethrough <line>
       over "使う". `text-decoration` is unreliable in SVG renderers (esp.
       Chromium), so we draw the strike manually for robustness. -->
  <text x="60" y="240" font-size="68" font-weight="900" fill="#ffffff" letter-spacing="-2">AI を <tspan fill="#7a7a7a">使う</tspan> 時代から、</text>
  <!-- strikethrough line through "使う" — width tuned for 68px font -->
  <line x1="194" y1="222" x2="346" y2="222" stroke="#7a7a7a" stroke-width="5" stroke-linecap="round"/>
  <text x="60" y="324" font-size="68" font-weight="900" fill="#ffffff" letter-spacing="-2">AI を <tspan fill="#fb923c">複数人雇う</tspan> 時代へ。</text>

  <!-- sub -->
  <text x="60" y="430" font-size="22" font-weight="500" fill="rgba(255,255,255,0.72)">Slack のような UI で AI を何人でも採用。</text>

  <!-- meta row -->
  <g transform="translate(60,490)" font-size="16" font-weight="700" fill="rgba(255,255,255,0.78)">
    <g><circle cx="10" cy="10" r="6" fill="#10b981"/><text x="28" y="16">30 秒で開始</text></g>
    <g transform="translate(180,0)"><circle cx="10" cy="10" r="6" fill="#10b981"/><text x="28" y="16">永年無料</text></g>
    <g transform="translate(310,0)"><circle cx="10" cy="10" r="6" fill="#10b981"/><text x="28" y="16">50 サービス連携</text></g>
  </g>

  <!-- footer URL -->
  <text x="60" y="585" font-size="18" font-weight="600" fill="rgba(255,255,255,0.42)" font-family="'SF Mono',ui-monospace,monospace">myaiagents.agency</text>
</svg>
