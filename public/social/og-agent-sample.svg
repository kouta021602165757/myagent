<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="-apple-system, 'Helvetica Neue', 'Hiragino Sans', sans-serif">
  <defs>
    <radialGradient id="bg" cx="30%" cy="20%" r="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="60%" stop-color="#fed7aa"/>
      <stop offset="130%" stop-color="#fb923c"/>
    </radialGradient>
    <linearGradient id="peach" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Base gradient -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative dots pattern -->
  <g opacity="0.10">
    <circle cx="80" cy="100" r="4" fill="#1a0a00"/>
    <circle cx="160" cy="180" r="4" fill="#1a0a00"/>
    <circle cx="240" cy="80" r="4" fill="#1a0a00"/>
    <circle cx="1120" cy="540" r="4" fill="#1a0a00"/>
    <circle cx="1040" cy="500" r="4" fill="#1a0a00"/>
    <circle cx="1100" cy="430" r="4" fill="#1a0a00"/>
  </g>

  <!-- Sticker: white rounded square with avatar emoji at left -->
  <g filter="url(#shadow)">
    <rect x="80" y="200" width="240" height="240" rx="40" fill="white"/>
  </g>
  <text x="200" y="380" text-anchor="middle" font-size="140">🐦</text>

  <!-- Right side: content stack -->
  <!-- Category pill -->
  <g transform="translate(360, 130)">
    <rect width="140" height="36" rx="18" fill="rgba(255,255,255,0.7)" stroke="rgba(180,90,30,0.16)"/>
    <text x="70" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#ea580c" letter-spacing="1">AI AGENT</text>
  </g>

  <!-- Title -->
  <text x="360" y="240" font-size="56" font-weight="900" fill="#1a0a00" letter-spacing="-1">X 自動運用エージェント</text>

  <!-- Description (2-line) -->
  <text x="360" y="298" font-size="22" font-weight="500" fill="#5c3a1e">採用目的: バズ投稿の量産で月間 100 万 imp を狙う。</text>
  <text x="360" y="332" font-size="22" font-weight="500" fill="#5c3a1e">業務内容: コンセプト設計 → 投稿生成 → エンゲージ運用</text>

  <!-- Stats row -->
  <g transform="translate(360, 380)" font-size="18" font-weight="700">
    <g transform="translate(0,0)">
      <rect width="120" height="44" rx="22" fill="rgba(255,255,255,0.7)" stroke="rgba(180,90,30,0.16)"/>
      <text x="60" y="29" text-anchor="middle" fill="#1a0a00">★ 4.9 (132)</text>
    </g>
    <g transform="translate(132,0)">
      <rect width="100" height="44" rx="22" fill="rgba(255,255,255,0.7)" stroke="rgba(180,90,30,0.16)"/>
      <text x="50" y="29" text-anchor="middle" fill="#1a0a00">利用 1.2k</text>
    </g>
    <g transform="translate(244,0)">
      <rect width="160" height="44" rx="22" fill="rgba(34,211,160,0.18)" stroke="rgba(34,211,160,0.36)"/>
      <text x="80" y="29" text-anchor="middle" fill="#047857">🟢 LIVE NOW</text>
    </g>
  </g>

  <!-- Creator + skills -->
  <text x="360" y="478" font-size="18" font-weight="600" fill="#9a6a4a">クリエイター: <tspan fill="#1a0a00" font-weight="800">@kota.takeuchi</tspan> <tspan fill="#2563eb">✓</tspan></text>
  <text x="360" y="510" font-size="16" font-weight="600" fill="#9a6a4a">スキル: マーケティング ・ ライティング ・ 分析</text>

  <!-- Brand badge bottom-right -->
  <g transform="translate(940, 540)">
    <rect width="220" height="56" rx="28" fill="#1a0a00"/>
    <!-- 3 mini bars logo -->
    <g transform="translate(20, 14)">
      <rect x="0" y="0" width="6" height="28" rx="3" fill="white"/>
      <rect x="10" y="6" width="6" height="22" rx="3" fill="white" opacity="0.65"/>
      <rect x="20" y="12" width="6" height="16" rx="3" fill="white" opacity="0.35"/>
    </g>
    <text x="62" y="36" font-size="18" font-weight="800" fill="#fff5e6" letter-spacing="1.5">MY AI AGENT</text>
  </g>

  <!-- Try-it CTA bottom-left -->
  <g transform="translate(80, 540)">
    <rect width="200" height="56" rx="28" fill="url(#peach)"/>
    <text x="100" y="37" text-anchor="middle" font-size="20" font-weight="800" fill="white">▸ Try it free</text>
  </g>
</svg>
