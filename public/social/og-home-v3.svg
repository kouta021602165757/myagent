<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg"
     font-family="'Inter','Helvetica Neue','Hiragino Sans','Noto Sans JP',Arial,sans-serif">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a3d39"/>
      <stop offset="100%" stop-color="#0d4f4a"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c0ff5c"/>
      <stop offset="100%" stop-color="#a3e635"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgA)"/>
  <!-- 装飾 円 -->
  <circle cx="1060" cy="540" r="380" fill="#c0ff5c" opacity="0.08"/>
  <circle cx="120" cy="120" r="180" fill="#c0ff5c" opacity="0.05"/>

  <!-- top row: brand -->
  <g transform="translate(60,52)">
    <rect width="48" height="48" rx="11" fill="#c0ff5c"/>
    <text x="24" y="34" text-anchor="middle" font-size="26" font-weight="900" fill="#0a3d39">M</text>
    <text x="64" y="32" font-size="20" font-weight="800" fill="#fff" letter-spacing="0.5">MY AI AGENT</text>
  </g>

  <!-- 右上 バッジ -->
  <g transform="translate(900,60)">
    <rect width="240" height="36" rx="18" fill="rgba(192,255,92,0.18)" stroke="rgba(192,255,92,0.42)" stroke-width="1"/>
    <text x="120" y="24" text-anchor="middle" font-size="13" font-weight="800" fill="#c0ff5c" letter-spacing="0.6">30 秒 で 開始 ・ Free 永久</text>
  </g>

  <!-- 主 メッセージ (= 最新 master pitch v3) -->
  <text x="60" y="220" font-size="56" font-weight="900" fill="#ffffff" letter-spacing="-2">AI が メディア を 構築 し、</text>
  <text x="60" y="296" font-size="56" font-weight="900" fill="#c0ff5c" letter-spacing="-2">あなた の サイト に 流入 を 起こす</text>

  <!-- sub -->
  <text x="60" y="372" font-size="22" font-weight="500" fill="rgba(255,255,255,0.82)">30+ 名 の AI マーケチーム が、 ブログ 立ち上げ → KW 調査 →</text>
  <text x="60" y="406" font-size="22" font-weight="500" fill="rgba(255,255,255,0.82)">記事 執筆 → 公開 → 改善 まで 24 時間 365 日 自動。</text>

  <!-- 5 動詞 chips -->
  <g transform="translate(60,460)" font-size="14" font-weight="800" fill="#0a3d39">
    <g><rect width="120" height="34" rx="17" fill="url(#accentBar)"/><text x="60" y="22" text-anchor="middle">📝 立ち 上げ</text></g>
    <g transform="translate(132,0)"><rect width="120" height="34" rx="17" fill="url(#accentBar)"/><text x="60" y="22" text-anchor="middle">🔍 KW 調査</text></g>
    <g transform="translate(264,0)"><rect width="120" height="34" rx="17" fill="url(#accentBar)"/><text x="60" y="22" text-anchor="middle">✍️ 記事 執筆</text></g>
    <g transform="translate(396,0)"><rect width="120" height="34" rx="17" fill="url(#accentBar)"/><text x="60" y="22" text-anchor="middle">🚀 自動 公開</text></g>
    <g transform="translate(528,0)"><rect width="120" height="34" rx="17" fill="url(#accentBar)"/><text x="60" y="22" text-anchor="middle">📈 改善</text></g>
  </g>

  <!-- footer URL -->
  <text x="60" y="585" font-size="18" font-weight="600" fill="rgba(255,255,255,0.5)" font-family="'SF Mono',ui-monospace,monospace">myaiagents.agency</text>

  <!-- 右下 装飾 (= AI チーム 数) -->
  <g transform="translate(880,540)">
    <text x="0" y="0" font-size="14" font-weight="600" fill="rgba(255,255,255,0.5)" letter-spacing="2">AI TEAM MEMBERS</text>
    <text x="0" y="36" font-size="44" font-weight="900" fill="#c0ff5c" letter-spacing="-1">30+</text>
  </g>
</svg>
