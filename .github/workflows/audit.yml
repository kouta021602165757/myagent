name: audit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Need ESLint for the audit. Use a stripped install that skips heavy
      # optional packages (playwright/chromium) to keep CI under a minute.
      - name: Install dev deps (ESLint only)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-audit --no-fund --ignore-scripts eslint globals
      - name: Run audit
        run: node scripts/audit.js --quick
